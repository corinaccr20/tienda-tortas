{% extends "base.html" %}
{% block content %}
    <h2>Bienvenido {{ current_user.username }} - Zona VIP</h2>
    <p>Estas son nuestras deliciosas tortas exclusivas:</p>
    <a href="{{ url_for('logout') }}">Cerrar Sesión</a>
    <hr>
    
    {% for torta in tortas %}
        <div class="card">
            <img src="{{ torta.imagen_url }}" alt="{{ torta.nombre }}" width="100%">
            <h3>{{ torta.nombre }}</h3>
            <p>{{ torta.descripcion }}</p>
            <strong>Precio: ${{ torta.precio }}</strong>
        </div>
    {% endfor %}
{% endblock %}
